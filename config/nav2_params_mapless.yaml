controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0 #20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3 # was 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14

    # ---------------- TEB local planner (replaces DWB) ----------------

    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      # Topics / frames
      odom_topic: odom
      map_frame: odom

      # Trajectory
      teb_autosize: 1.0
      dt_ref: 0.4 #0.3
      dt_hysteresis: 0.04 #0.1
      min_samples: 3
      global_plan_overwrite_orientation: True
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 1.5   # local costmap is 3 m x 3 m, so keep this <= 1.5
      global_plan_prune_distance: 1.0
      force_reinit_new_goal_dist: 1.0
      force_reinit_new_goal_angular: 0.78
      feasibility_check_no_poses: 5
      publish_feedback: False
      complete_global_plan: True

      # Robot kinematics (diff-drive, limits taken from your DWB / velocity_smoother values)
      max_vel_x: 0.25
      max_vel_x_backwards: 0.05     # must be > 0 for TEB; kept tiny because the camera faces forward only
      max_vel_y: 0.0
      max_vel_theta: 1.0 #1.5
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.5 #3.2
      min_turning_radius: 0.0       # 0.0 = diff-drive can turn in place
      wheelbase: 0.0
      cmd_angle_instead_rotvel: False
      is_footprint_dynamic: False

      # Footprint: circle circumscribing your 0.50 x 0.44 m rectangle (conservative for now)
      footprint_model:
        type: "circular"
        radius: 0.31

      # Goal tolerances are handled by general_goal_checker above
      free_goal_vel: False

      # Obstacles
      min_obstacle_dist: 0.15
      inflation_dist: 0.35
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 10.5 #1.0
      obstacle_poses_affected: 6 # 15
      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: False
      legacy_obstacle_association: False
      obstacle_association_force_inclusion_factor: 1.5
      obstacle_association_cutoff_factor: 3.0 #5.0

      # Costmap converter disabled for the first run (raw costmap cells are used as point obstacles)
      costmap_converter_plugin: ""
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5.0

      # Optimization
      no_inner_iterations: 3 #5
      no_outer_iterations: 2 # 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 1000.0   # strongly discourages reversing
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.1
      weight_dynamic_obstacle: 10.0
      weight_dynamic_obstacle_inflation: 0.1
      weight_viapoint: 1.0
      weight_adapt_factor: 2.0

      # Homotopy class planning
      enable_homotopy_class_planning: False
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 1.0
      selection_prefer_initial_plan: 0.95
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: False
      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

      # Recovery
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0

    # ---------------- Previous DWB config (rollback reference) ----------------
    # FollowPath:
    #   plugin: "dwb_core::DWBLocalPlanner"
    #   debug_trajectory_details: True
    #   min_vel_x: 0.05
    #   min_vel_y: 0.0
    #   max_vel_x: 0.25
    #   max_vel_y: 0.0
    #   max_vel_theta: 1.5
    #   min_speed_xy: 0.25
    #   max_speed_xy: 0.55
    #   min_speed_theta: 0.1
    #   acc_lim_x: 2.5
    #   acc_lim_y: 0.0
    #   acc_lim_theta: 3.2
    #   decel_lim_x: -2.5
    #   decel_lim_y: 0.0
    #   decel_lim_theta: -3.2
    #   vx_samples: 30
    #   vy_samples: 5
    #   vtheta_samples: 30
    #   sim_time: 0.8 #1.0
    #   linear_granularity: 0.05
    #   angular_granularity: 0.025
    #   transform_tolerance: 0.2
    #   xy_goal_tolerance: 0.25
    #   trans_stopped_velocity: 0.25
    #   short_circuit_trajectory_evaluation: True
    #   stateful: True
    #   critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    #   BaseObstacle.scale: 0.2
    #   PathAlign.scale: 24.0
    #   PathAlign.forward_point_distance: 0.1
    #   GoalAlign.scale: 24.0
    #   GoalAlign.forward_point_distance: 0.1
    #   PathDist.scale: 24.0
    #   GoalDist.scale: 20.0
    #   RotateToGoal.scale: 32.0
    #   RotateToGoal.slowing_factor: 5.0
    #   RotateToGoal.lookahead_time: -1.0

    #custom costmap- stvl using depth pcd from camera
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0 # 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.25, 0.22], [0.25, -0.22], [-0.25, -0.22], [-0.25, 0.22]]"
      plugins: ["stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.25 #0.6
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 1.0
        decay_model: 0
        voxel_size: 0.03
        track_unknown_space: true
        mark_threshold: 1
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.1
        mapping_mode: false
        observation_sources: depth_cloud
        depth_cloud:
          data_type: PointCloud2
          topic: /filtered_points
          marking: true
          clearing: true
          min_obstacle_height: 0.03
          max_obstacle_height: 2.0
          obstacle_range: 1.5 #2.0
          raytrace_range: 1.5 #2.0
          expected_update_rate: 1.0 #0.5
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          voxel_min_points: 1
      always_send_full_costmap: True


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 20
      height: 20
      footprint: "[[0.25, 0.22], [0.25, -0.22], [-0.25, -0.22], [-0.25, 0.22]]"
      resolution: 0.05
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: -1.0
        decay_model: 0
        voxel_size: 0.03
        track_unknown_space: false
        mark_threshold: 1
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.1
        mapping_mode: false
        observation_sources: depth_cloud
        depth_cloud:
          data_type: PointCloud2
          topic: /filtered_points
          marking: true
          clearing: true
          min_obstacle_height: 0.03
          max_obstacle_height: 2.0
          obstacle_range: 2.0
          raytrace_range: 2.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          voxel_min_points: 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.25 #0.55
      always_send_full_costmap: True


planner_server:
  ros__parameters:
    expected_planner_frequency: 0.0000000000000001
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.55 # 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.5]
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
