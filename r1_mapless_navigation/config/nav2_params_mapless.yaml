controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0          # keep at 10: the costmap is very dynamic, so the planner must re-plan quickly
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5       # irrelevant for a diff-drive robot
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5              # was 0.3: rides out costmap flicker (voxel decay is 1.0 s); robot holds still 
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14


    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"


      odom_topic: odom
      map_frame: odom                   # same frame as the local costmap


      teb_autosize: 1.0                 # double in the ROS 2 port (1.0 = true)
      dt_ref: 0.3                       # keep <= 0.6; larger values risk infeasible trajectories
      dt_hysteresis: 0.03               # about 10% of dt_ref
      min_samples: 3
      max_samples: 500
      global_plan_overwrite_orientation: True
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 1.5   # matches  1.5 m sensing range and the 3 m local costmap
      global_plan_viapoint_sep: 0.5     # via-points along the global plan reduce wandering
      global_plan_prune_distance: 1.0
      exact_arc_length: False
      force_reinit_new_goal_dist: 1.0
      force_reinit_new_goal_angular: 0.78
      feasibility_check_no_poses: 3     # only the nearest poses are checked, so far-away flicker cannot stop the robot
      publish_feedback: False
      complete_global_plan: True


      max_vel_x: 0.35 #0.25
      max_vel_x_backwards: 0.05         # must be > 0 for TEB; reversing is also discouraged by weight_kinematics_forward_drive
      max_vel_y: 0.0
      max_vel_theta: 0.6                # slower turns keep obstacles in a forward-only camera view long enough
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      min_turning_radius: 0.0
      wheelbase: 0.0
      cmd_angle_instead_rotvel: False
      is_footprint_dynamic: False


      footprint_model:
        type: "two_circles"
        front_offset: 0.10
        front_radius: 0.22
        rear_offset: 0.10
        rear_radius: 0.22


      free_goal_vel: False              # xy/yaw tolerances come from general_goal_checker


      min_obstacle_dist: 0.2 #0.27           # optimizer clearance; kept above the costmap inscribed radius (0.22) so plans pass the feasibility check
      inflation_dist: 0.40   #0.50           # must be > min_obstacle_dist
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 0.5
      obstacle_poses_affected: 15        # point obstacles need few neighbors - previously 8 - controls the allowable poses along the obstacle in the trajectory
      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: False
      legacy_obstacle_association: False
      obstacle_association_force_inclusion_factor: 1.5
      obstaclce_association_cutoff_factor: 4.0
      costmap_converter_plugin: "CostmapToPolygonsDBSMCCH"      # off; costmap cells are point obstacles
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5.0


      no_inner_iterations: 5            # if the loop misses 10 Hz, try 4
      no_outer_iterations: 5            # if the loop misses 10 Hz, try 3
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.05             # margin inside each velocity limit; 0.1 is large for a 0.25 m/s robot
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 1000.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0
      weight_shortest_path: 0.0
      weight_obstacle: 50.0 #100.0
      weight_inflation: 0.1
      weight_dynamic_obstacle: 10.0
      weight_dynamic_obstacle_inflation: 0.1
      weight_viapoint: 5.0
      weight_adapt_factor: 2.0

      # ---- Homotopy class planning 
      enable_homotopy_class_planning: False   #controls the parallel planning along the trajectory
      enable_multithreading: True
      max_number_classes: 2
      selection_cost_hysteresis: 1.0
      selection_prefer_initial_plan: 0.95
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: False
      roadmap_graph_no_samples: 8
      roadmap_graph_area_width: 3.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0


      shrink_horizon_backup: True
      shrink_horizon_min_duration: 3.0  # was 10; with a 1 s costmap memory a long shrink is not needed
      oscillation_recovery: True
      oscillation_v_eps: 0.05           # was 0.1; 0.1 is 40% of your max speed
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 5.0
      oscillation_filter_duration: 10.0

    #custom costmap- stvl using depth pcd from camera
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0           #TEB actually reads, keep it at 10
      publish_frequency: 2.0            # visualization only
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.10                  # every lethal cell is a TEB obstacle point; if gaps look blocked, go back to 0.05
      footprint: "[[0.25, 0.22], [0.25, -0.22], [-0.25, -0.22], [-0.25, 0.22]]"
      track_unknown_space: false        # unknown cells can count as collisions in the feasibility check
      plugins: ["stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.40          # was 0.6; only the inscribed zone (0.22) matters to TEB
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 1.0                # unchanged, as required
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 1
        update_footprint_enabled: true  # clears voxels under the robot body (no self-detection)
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false        # turn on only when debugging in RViz
        transform_tolerance: 0.3        # was 0.1; a tight value drops clouds when TF lags
        mapping_mode: false
        observation_sources: depth_cloud
        depth_cloud:
          data_type: PointCloud2
          topic: /filtered_points
          marking: true
          clearing: true
          min_obstacle_height: 0.10     # was 0.03; stereo floor noise easily reaches 3 cm
          max_obstacle_height: 2.0      # lower this to your robot's height if overhead structures should be ignored
          obstacle_range: 1.5
          raytrace_range: 1.5
          expected_update_rate: 0.0     # was 0.5; a non-zero value purges the buffer when clouds arrive slower than this
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          voxel_min_points: 2           # was 1; lower to 1 if thin real obstacles are missed
          # Frustum clearing 
          # min_z: 0.1
          # max_z: 2.0
          # vertical_fov_angle: <camera vertical FOV in radians>
          # horizontal_fov_angle: <camera horizontal FOV in radians>
          # decay_acceleration: 1.0     # start low; high values erase real obstacles between slow cloud frames
          # model_type: 0
      always_send_full_costmap: False


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 20
      height: 20
      footprint: "[[0.25, 0.22], [0.25, -0.22], [-0.25, -0.22], [-0.25, 0.22]]"
      resolution: 0.05
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: -1.0
        decay_model: 0
        voxel_size: 0.03
        track_unknown_space: false
        mark_threshold: 1
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.1
        mapping_mode: false
        observation_sources: depth_cloud
        depth_cloud:
          data_type: PointCloud2
          topic: /filtered_points
          marking: true
          clearing: true
          min_obstacle_height: 0.03
          max_obstacle_height: 2.0
          obstacle_range: 2.0
          raytrace_range: 2.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          voxel_min_points: 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.55
      always_send_full_costmap: True


planner_server:
  ros__parameters:
    expected_planner_frequency: 0.0000000000000001
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
