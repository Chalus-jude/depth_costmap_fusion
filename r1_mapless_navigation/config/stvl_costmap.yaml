costmap:
  costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      always_send_full_costmap: true 
      global_frame: odom
      robot_radius: 0.2
      use_sim_time: false
      robot_base_frame: base_link

      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05

      plugins: ["stvl_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true

        voxel_decay: 1.0            # seconds; tune down for faster clearing    #programmed for  -15
        decay_model: 0               # 0=linear, 1=exponential, 2=persistent

        voxel_size: 0.03

        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 3  #minimum requirement of points to form voxel grid was 2

        update_footprint_enabled: true
        combination_method: 1        # 1 = max

        origin_z: 0.0

        publish_voxel_map: true

        transform_tolerance: 0.5

        mapping_mode: false

        map_save_duration: 60.0


        #source
        observation_sources: "filtered_cloud"
        filtered_cloud:
          data_type: "PointCloud2"
          topic: /filtered_points
          marking: true
          clearing: true


          obstacle_range: 2.0
          raytrace_range: 2.0

          min_obstacle_height: 0.03  # camera at z=0.08505 above base_link, no tilt;
                                       # floor lands near z=-0.085, was 0.05

        #the default camera frame orientation is set as Z for forward but the current R1 Geifers camera orientation has X as forward
          max_obstacle_height: 2.0  #6m previously set      # so it range filters the x axis the range of pcd in terms of length forward instead of filtering upwards



          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true # false if it is a local costmap with temp cost necessity

          voxel_min_points: 2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
